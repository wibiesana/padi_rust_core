[package]
name = "padi_core"
version = "0.1.0"
edition = "2021"
description = "Core engine for Padi Rust Api Framework"
license = "MIT"
authors = ["Wibiesana <wibiesana@yahoo.com>"]
repository = "https://github.com/wibiesana/padi_rust_core"
homepage = "https://padisoftware.my.id"
readme = "README.md"
keywords = ["padi", "rest", "api", "framework", "axum"]
categories = ["web-programming::http-server", "database"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "catch-panic", "set-header", "trace"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "mysql", "postgres", "sqlite", "macros"] }
jsonwebtoken = "9"
bcrypt = "0.15"
regex = "1"
chrono = "0.4"
dotenvy = "0.15"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
